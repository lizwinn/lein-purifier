# SPDX-License-Identifier: MIT
#
# Runs every check of the flake (the unit tests, the fixture builds in the
# Nix sandbox, the refusals of bad lockfiles and the formatting check) on
# x86_64-linux and aarch64-linux, and tests the parts of lein-purifier that
# run outside the sandbox: the lock run, the interactive mode and deploy.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - run: nix flake check -L
      - run: tests/lock.sh
      - run: tests/interactive.sh
      - run: tests/deploy.sh
