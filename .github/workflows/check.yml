# SPDX-License-Identifier: MIT
#
# Runs every check of the flake (the fixture builds in the Nix sandbox,
# the stale-lock refusals and the formatting check), evaluates the checks
# for every system, and tests the parts of lein-purifier that run outside
# the sandbox: the lock run, the interactive mode and deploy.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - run: nix flake check -L
      - run: nix flake check --all-systems --no-build
      - run: tests/lock.sh
      - run: tests/interactive.sh
      - run: tests/deploy.sh
